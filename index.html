<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>FastBoost</title><meta name="theme-color" content="#07070b"><meta name="description" content="Likes, abonnés et vues pour vos réseaux sociaux. Paiement Mobile Money."><meta name="apple-mobile-web-app-capable" content="yes"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon.svg">
<style>
:root{--c:#d4af37;--bg:#07070b;--s1:#0f0f16;--s2:#171722;--bd:#262633;--tx:#f5f5f7;--mu:#8b8b9d}
*{box-sizing:border-box;margin:0;padding:0}
body{font:15px/1.45 Inter,system-ui,sans-serif;background:radial-gradient(800px 380px at 50% -120px,rgba(212,175,55,.14),transparent),var(--bg);background-attachment:fixed;color:var(--tx);padding-bottom:84px;-webkit-font-smoothing:antialiased}
main{padding:16px;max-width:640px;margin:auto}
header{position:sticky;top:0;z-index:5;background:rgba(7,7,11,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--bd);padding:13px 16px;display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:19px;letter-spacing:-.3px;color:#fff}
.chip{background:#fff;color:#0a0a0f;padding:8px 14px;border-radius:20px;font-size:13px;font-weight:700;cursor:pointer}
input,select{width:100%;padding:13px 14px;margin-top:6px;background:var(--s2);color:var(--tx);border:1px solid var(--bd);border-radius:13px;font:inherit;outline:0;transition:.2s}
input:focus{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.08)}
input::placeholder{color:#5d5d70}
label{display:block;margin-top:13px;font-size:12px;font-weight:600;color:var(--mu);text-transform:uppercase;letter-spacing:.6px}
h2{margin:6px 0 12px;font-size:21px;letter-spacing:-.4px;color:#fff}
.card{background:linear-gradient(180deg,var(--s1),#0b0b11);border:1px solid var(--bd);border-radius:18px;padding:15px;margin-bottom:12px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.btn{width:100%;margin-top:13px;padding:14px;border:0;border-radius:13px;background:#fff;color:#0a0a0f;font:inherit;font-weight:700;cursor:pointer;transition:.2s}
.btn:active{transform:scale(.98)}.btn:hover{opacity:.92}
.btn.s{width:auto;margin:0;padding:9px 14px;font-size:13px;border-radius:11px}
.btn.g{background:var(--s2);color:var(--tx);border:1px solid var(--bd)}.btn.r{background:#dc2626;color:#fff}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.mu{color:var(--mu);font-size:13px;margin-top:4px}
.mini{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#1a1a24,#0c0c12);border:1px solid var(--bd);border-radius:22px;padding:22px 18px;margin-bottom:14px}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(212,175,55,.35),transparent 70%)}
.hero h2{font-size:25px;margin:0 0 6px;position:relative}.hero p{color:#c3c3d0;position:relative}
.pills{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-top:14px;position:relative}.pills span{font-size:12px;font-weight:600;padding:6px 11px;border:1px solid var(--bd);border-radius:20px;background:rgba(255,255,255,.04)}
.st{padding:4px 11px;border-radius:12px;font-size:12px;font-weight:700;background:rgba(245,158,11,.14);color:#fbbf24}.s2{background:rgba(59,130,246,.15);color:#93c5fd}.s3{background:rgba(16,185,129,.15);color:#6ee7b7}.s4{background:rgba(239,68,68,.15);color:#fca5a5}
.link{word-break:break-all;background:var(--s2);border:1px dashed var(--bd);padding:9px;border-radius:11px;font-size:13px;margin:9px 0;color:#c3c3d0}
.tabs{display:flex;gap:7px;overflow-x:auto;margin-bottom:13px;scrollbar-width:none}.tabs button{flex:0 0 auto;padding:9px 15px;border-radius:20px;border:1px solid var(--bd);background:var(--s1);font:inherit;font-weight:600;font-size:14px;color:var(--mu);cursor:pointer}.tabs .on{background:#fff;color:#0a0a0f;border-color:#fff}
.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(10,10,15,.88);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--bd);display:flex;padding:7px 4px calc(7px + env(safe-area-inset-bottom,0px))}
.nav button{flex:1;border:0;background:none;font:inherit;font-size:11px;font-weight:600;color:var(--mu)}.nav .on{color:var(--c)}.nav span{display:block;font-size:20px}
.pay{display:flex;gap:10px;justify-content:space-between;width:100%;padding:13px;margin-top:9px;border:1px solid var(--bd);border-radius:14px;background:var(--s2);color:var(--tx);font:inherit;text-align:left;cursor:pointer}.pay.on{border-color:var(--c);background:rgba(212,175,55,.08)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(4px);z-index:50;display:flex;align-items:flex-end}.sheet{background:var(--s1);border:1px solid var(--bd);width:100%;max-width:640px;margin:auto;border-radius:24px 24px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto}
.toast{position:fixed;top:72px;left:50%;transform:translateX(-50%);background:#fff;color:#0a0a0f;font-weight:600;padding:11px 18px;border-radius:14px;z-index:99;max-width:90%;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.empty{text-align:center;color:var(--mu);padding:34px}
summary{outline:0}.gr{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}.gr .card{margin:0}.hs{display:flex;gap:10px;overflow-x:auto;margin-bottom:14px;scrollbar-width:none}a.btn{display:block;text-align:center;text-decoration:none}details[open]>summary{margin-bottom:6px}
.gold{background:linear-gradient(90deg,#f6dd8a,#d4af37 60%,#b8892b);-webkit-background-clip:text;background-clip:text;color:transparent}
body:before{content:"";position:fixed;inset:0;z-index:-1;background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:44px 44px;-webkit-mask-image:radial-gradient(circle at 50% 0,#000,transparent 70%);mask-image:radial-gradient(circle at 50% 0,#000,transparent 70%)}
.hero{padding:30px 20px;border-color:#32323f;box-shadow:0 20px 60px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.06)}.hero h2{font-size:30px;letter-spacing:-1px}.hero .btn{box-shadow:0 8px 24px rgba(255,255,255,.12)}
.card{border-color:#2a2a38;background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.012)),var(--s1);box-shadow:0 10px 30px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.05)}
.btn:not(.g):not(.r){background:linear-gradient(180deg,#fff,#e2e2e8)}.chip{box-shadow:0 4px 14px rgba(255,255,255,.12)}
</style></head><body>
<div id="app"></div><div id="modal"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// 1) Collez ici l'URL et la clé "anon public" de votre projet Supabase (Project Settings > API).
// La clé anon est faite pour être publique : la sécurité vient des règles RLS de schema.sql.
const SB_URL='https://VOTRE-PROJET.supabase.co',SB_KEY='VOTRE_CLE_ANON';
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=s=>document.querySelector(s);
const fc=n=>{if(cur=='USD'&&me?.role!='admin'){const u=n/(cfg.usd_rate||2800);return '$'+u.toFixed(u<1?3:2)}return Math.round(n).toLocaleString('fr-FR')+' FC'};
const setCur=c=>{cur=c;try{localStorage.setItem('jb_cur',c)}catch(e){}render()};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ST=['En attente','En attente','En cours','Terminé','Annulé'],DS=['En attente','Validée','Refusée'],DC=[0,3,4];
let me,cfg={},S=[],P=[],tab='home',atab='orders',auth='login',pay=null,q='',plat='all',view='landing',cur=(()=>{try{return localStorage.getItem('jb_cur')||'FC'}catch(e){return 'FC'}})();
const REF=new URLSearchParams(location.search).get('ref')||'';if(REF){view='auth';auth='signup'}
const toast=m=>{const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),2500)};
const modal=h=>$('#modal').innerHTML=h?`<div class="modal" onclick="if(event.target===this)modal()"><div class="sheet">${h}</div></div>`:'';
const fake=p=>p.replace(/\D/g,'')+'@jobboost.app';

async function loadAll(){
 const[a,b,c]=await Promise.all([sb.from('settings').select('*').eq('id',1).single(),sb.from('services').select('*').order('id'),sb.from('pay_methods').select('*').order('id')]);
 cfg=a.data||{};S=b.data||[];P=c.data||[];
 document.title=cfg.name||'FastBoost';cfg.color&&cfg.color!=='#10b981'&&document.documentElement.style.setProperty('--c',cfg.color);
}
async function refresh(){const{data:{session}}=await sb.auth.getSession();me=session?(await sb.from('profiles').select('*').eq('id',session.user.id).single()).data:null}
async function boot(){await refresh();await loadAll();render()}

async function signup(){
 const n=$('#nm').value.trim(),p=$('#ph').value.replace(/\s/g,''),w=$('#pw').value;
 if(!n||p.length<8||w.length<6)return toast('Remplissez tout (mot de passe : 6 caractères min)');
 const{error}=await sb.auth.signUp({email:fake(p),password:w,options:{data:{name:n,phone:p,ref:($('#rf0')?.value||'').trim()}}});
 error?toast(error.message):boot();
}
async function login(){
 const{error}=await sb.auth.signInWithPassword({email:fake($('#ph').value),password:$('#pw').value});
 error?toast('Numéro ou mot de passe incorrect'):boot();
}
async function logout(){await sb.auth.signOut();me=null;auth='login';view='landing';render()}

const authV=()=>`<main><div class="mu" onclick="view='landing';render()" style="cursor:pointer">← Accueil</div><div class="hero" style="text-align:center;margin-top:12px"><h2>⚡ ${brand()}</h2><p>Boostez vos réseaux sociaux : abonnés, likes et vues.</p><div class="pills"><span>📱 Mobile Money</span><span>💬 Support WhatsApp</span><span>📦 Suivi en direct</span></div></div>
<div class="tabs"><button class="${auth=='login'?'on':''}" onclick="auth='login';render()">Connexion</button><button class="${auth=='signup'?'on':''}" onclick="auth='signup';render()">Créer un compte</button></div>
<div class="card">${auth=='signup'?'<label>Votre nom</label><input id="nm"><label>Code parrain (optionnel)</label><input id="rf0" value="'+esc(REF)+'">':''}<label>Téléphone</label><input id="ph" type="tel" placeholder="0812345678"><label>Mot de passe</label><input id="pw" type="password">
<button class="btn" onclick="${auth=='signup'?'signup()':'login()'}">${auth=='signup'?'Créer mon compte':'Me connecter'}</button></div></main>`;

const brand=()=>{const n=cfg.name||'FastBoost',m=n.match(/^(.+?)(boost)$/i);return m?`${esc(m[1])}<span class="gold">${esc(m[2])}</span>`:esc(n)};
const BR={Facebook:['#1877f2','f'],TikTok:['#2a2a33','♪'],Instagram:['#e1306c','◎'],YouTube:['#f00','▶'],Telegram:['#229ed9','➤'],Snapchat:['#fffc00','👻'],WhatsApp:['#25d366','✆'],Spotify:['#1db954','♫'],X:['#2a2a33','𝕏']};
const ico=(p,z=44)=>{const b=BR[p]||['#334155',(p||'?')[0]];return `<span style="flex:0 0 auto;width:${z}px;height:${z}px;border-radius:12px;background:${b[0]};color:${b[0]=='#fffc00'?'#000':'#fff'};display:grid;place-items:center;font-weight:800;font-size:${z/2}px">${b[1]}</span>`};
const rest=o=>o.st==3?0:o.st==4?o.qty:(o.rest??o.qty);
const O={};
const cp=async t=>{try{await navigator.clipboard.writeText(t);toast('Copié')}catch(e){prompt('Copiez :',t)}};
const setRest=(id,cur)=>{const v=prompt('Quantité restante ?',cur);if(v!==null)rpc('set_rest',{p_id:id,p_rest:Math.max(0,parseInt(v)||0)},'Restant mis à jour')};
const exp=async t=>{const{data}=await sb.from(t).select('*');if(!data?.length)return toast('Rien à exporter');const k=Object.keys(data[0]);const csv=[k.join(','),...data.map(r=>k.map(c=>JSON.stringify(r[c]??'')).join(','))].join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=`jobboost-${t}-${new Date().toISOString().slice(0,10)}.csv`;a.click()};
const stats=async()=>{const{data:o}=await sb.from('orders').select('price,cost,st');const{count:pd}=await sb.from('deposits').select('*',{count:'exact',head:true}).eq('st',0);let rv=0,pr=0,pe=0;(o||[]).forEach(x=>{if(x.st!=4){rv+=x.price;pr+=x.price-x.cost}if(!x.st)pe++});const c=(v,l,col)=>`<div class="card" style="margin:0"><b style="font-size:18px;color:${col||'inherit'}">${v}</b><div class="mu">${l}</div></div>`;return`<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px">${c(fc(rv),'Ventes')}${c(fc(pr),'Bénéfice','var(--c)')}${c(pe,'Commandes en attente')}${c(pd||0,'Recharges en attente')}</div>`};
/* ===== CLIENT ===== */
const hdr=()=>`<header>⚡ ${brand()}<span style="display:flex;gap:8px"><span class="chip" style="background:var(--s2);color:#fff;border:1px solid var(--bd)" onclick="setCur('${cur=='FC'?'USD':'FC'}')">${cur=='FC'?'$ USD':'FC'}</span><span class="chip" onclick="tab='fund';render()">💼 ${fc(me.bal)}</span></span></header>`;
const nav=()=>'<div class="nav">'+[['home','🏠','Accueil'],['orders','📦','Commandes'],['fund','💰','Recharger'],['acc','👤','Compte']].map(t=>`<button class="${tab==t[0]?'on':''}" onclick="tab='${t[0]}';render()"><span>${t[1]}</span>${t[2]}</button>`).join('')+'</div>';
const list=()=>S.filter(s=>s.active&&(plat=='all'||s.plat==plat)&&(s.plat+' '+s.name).toLowerCase().includes(q.toLowerCase())).map(s=>`<div class="card"><div style="display:flex;gap:12px;align-items:center">${ico(s.plat,52)}<div><b>${esc(s.em)} ${esc(s.plat)} · ${esc(s.name)}</b><div class="mu">Min ${s.qmin} · Max ${s.qmax.toLocaleString('fr-FR')}</div></div></div><div class="row" style="margin-top:8px"><span class="mu">Pour 1 000</span><b>${fc(s.price)}</b></div><button class="btn" onclick="order(${s.id})">Acheter →</button></div>`).join('')||'<div class="empty">Aucun service</div>';
const homeV=()=>`<div class="hero"><h2>Boostez vos réseaux</h2><p>Choisissez un service. Livraison rapide.</p></div>${bestSec()}<input placeholder="🔍 Rechercher" value="${esc(q)}" oninput="q=this.value;$('#list').innerHTML=list()" style="margin:0 0 12px"><div class="tabs" style="margin-top:12px">${['all',...new Set(S.filter(s=>s.active).map(s=>s.plat))].map(p=>`<button class="${plat==p?'on':''}" onclick="plat='${esc(p)}';render()">${p=='all'?'✨ Tous':esc(p)}</button>`).join('')}</div><div id="list">${list()}</div>`;
function order(id){const s=S.find(x=>x.id==id);modal(`<h2>${esc(s.plat)} · ${esc(s.name)}</h2><label>Lien du profil ou de la publication</label><input id="lk" placeholder="https://..."><label>Quantité (${s.qmin} à ${s.qmax})</label><input id="qt" type="number" inputmode="numeric" oninput="$('#tt').textContent=fc(${s.price}*this.value/1000)"><div class="card row" style="margin-top:14px"><span class="mu">Total</span><b id="tt">0 FC</b></div><button class="btn" onclick="place(${id})">Commander</button>`)}
async function place(id){const lk=$('#lk').value.trim(),qt=+$('#qt').value,s=S.find(x=>x.id==id);
 if(!/^https?:\/\/|^@/i.test(lk))return toast('Collez un lien valide (https://... ou @pseudo)');
 const{data,error}=await sb.rpc('place_order',{p_sid:id,p_link:lk,p_qty:qt});if(error)return toast(error.message);
 await refresh();tab='orders';render();
 const m=encodeURIComponent(`Nouvelle commande ${cfg.name} n°${data}\nClient : ${me.name} (ID ${me.num} · ${me.phone})\nService : ${s.plat} · ${s.name}\nLien : ${lk}\nQuantité : ${qt}`);
 modal(`<h2>✅ Commande n°${data} envoyée</h2><p class="mu">Envoyez-la aussi sur WhatsApp pour un traitement plus rapide.</p>${cfg.wa?`<button class="btn" style="background:#25d366" onclick="window.open('https://wa.me/${cfg.wa}?text=${m}')">Envoyer sur WhatsApp</button>`:''}<button class="btn g" onclick="modal()">Fermer</button>`)}
const ordersV=async()=>{const{data}=await sb.from('orders').select('*').eq('uid',me.id).order('id',{ascending:false});
 return '<h2>Mes commandes</h2>'+((data||[]).map(o=>`<div class="card"><div class="row"><span style="display:flex;gap:10px;align-items:center">${ico(o.sname.split(' · ')[0],36)}<b>${esc(o.sname)}</b></span><span class="st s${o.st}">${ST[o.st]}</span></div><div class="mu">n°${o.id} · Qté ${o.qty} · Restant ${rest(o)} · ${fc(o.price)} · ${new Date(o.at).toLocaleDateString('fr-FR')}</div>${o.st==3&&Date.now()-new Date(o.at)<2592e6?`<button class="btn s g" style="margin-top:9px" onclick="refill(${o.id})">🔄 Demander une recharge</button>`:''}</div>`).join('')||'<div class="empty">Aucune commande</div>')};
const fundV=async()=>{const{data:d}=await sb.from('deposits').select('*').eq('uid',me.id).order('id',{ascending:false});const p=P.find(x=>x.id==pay);
 return `<h2>Recharger mon compte</h2><div class="card"><b>1. Moyen de paiement</b>${P.map(m=>`<button class="pay ${pay==m.id?'on':''}" onclick="pay=${m.id};render()"><b>${esc(m.name)}</b><span class="mu">${esc(m.num||'Bientôt')}</span></button>`).join('')}</div>`
 +(p&&p.num?`<div class="card"><b>2. Envoyez l'argent au ${esc(p.num)}</b><label>Montant envoyé (FC)</label><input id="am" type="number"><label>Référence / numéro émetteur</label><input id="rf"><button class="btn" onclick="dep()">J'ai payé</button></div>`:'')
 +(d&&d.length?'<h2>Mes recharges</h2>':'')+(d||[]).map(x=>`<div class="card row"><div><b>${fc(x.amount)}</b><div class="mu">${esc(x.method)}</div></div><span class="st s${DC[x.st]}">${DS[x.st]}</span></div>`).join('')};
async function dep(){const a=+$('#am').value,p=P.find(x=>x.id==pay);if(a<500)return toast('Minimum 500 FC');
 const{error}=await sb.from('deposits').insert({uid:me.id,amount:a,method:p.name,ref:$('#rf').value.trim()});if(error)return toast(error.message);
 toast('Demande envoyée. Envoyez la capture sur WhatsApp.');if(cfg.wa)window.open('https://wa.me/'+cfg.wa+'?text='+encodeURIComponent(`Recharge ${a} FC via ${p.name} - ${me.name} (${me.phone})`));render()}
const accV=async()=>{const{data:tx}=await sb.from('transactions').select('*').eq('uid',me.id).order('id',{ascending:false}).limit(30);const hist=(tx||[]).map(x=>`<div class="card row"><div><b>${esc(x.label)}</b><div class="mu">${new Date(x.at).toLocaleString('fr-FR')}</div></div><b style="color:${x.amount>0?'#34d399':'#f87171'}">${x.amount>0?'+':''}${fc(x.amount)}</b></div>`).join('')||'<div class="empty">Aucun mouvement</div>';return`<div class="card"><h2>${esc(me.name)}</h2><div class="mu">ID ${me.num} · ${esc(me.phone)}</div><div class="mu">Solde : <b>${fc(me.bal)}</b></div></div>${cfg.wa?`<button class="btn" onclick="window.open('https://wa.me/${cfg.wa}')">💬 Support WhatsApp</button>`:''}<div class="card"><b>🎁 Code promo</b><div class="mini"><input id="pcode" placeholder="Votre code" style="flex:1;margin:0"><button class="btn s" onclick="redeem()">Valider</button></div></div><div class="card"><b>👥 Parrainez vos amis</b><div class="mu">Gagnez ${cfg.ref_pct||0} % sur la première recharge de chaque ami inscrit avec votre code.</div><div class="link">${esc(me.code)}</div><div class="mini"><button class="btn s g" onclick="cp(refLink())">Copier le lien</button><button class="btn s" style="background:#25d366;color:#fff" onclick="window.open('https://wa.me/?text='+encodeURIComponent('Rejoins '+cfg.name+' : '+refLink()))">WhatsApp</button></div></div><button class="btn g" onclick="logout()">Me déconnecter</button>${legalLinks()}<h2 style="margin-top:18px">Historique du solde</h2>${hist}`};

/* ===== ADMIN (accessible aux comptes role=admin uniquement ; sécurité réelle via RLS) ===== */
const refLink=()=>location.origin+location.pathname+'?ref='+me.code;
const refill=async id=>{const{error}=await sb.rpc('request_refill',{p_oid:id});toast(error?error.message:'Demande envoyée. Nous la traitons au plus vite.')};
const redeem=async()=>{const{data,error}=await sb.rpc('redeem_promo',{p_code:$('#pcode').value});if(error)return toast(error.message);await refresh();toast('+'+fc(data)+' ajoutés');render()};
const doneRefill=async id=>{await sb.from('refills').update({st:1}).eq('id',id);render()};
const addPromo=async()=>{const code=$('#pc').value.trim().toUpperCase(),amount=+$('#pa').value,max_uses=+$('#pm').value||100;if(!/^[A-Z0-9]{3,20}$/.test(code)||!(amount>0))return toast('Code (lettres/chiffres) et montant requis');const{error}=await sb.from('promos').insert({code,amount,max_uses});error?toast(error.message):toast('Code créé');render()};
const togPromo=async(c,a)=>{await sb.from('promos').update({active:a}).eq('code',c);render()};
const delPromo=async c=>{await sb.from('promos').delete().eq('code',c);render()};
const rpc=async(f,a,m)=>{const{error}=await sb.rpc(f,a);toast(error?error.message:m);render()};
const setSt=(i,s)=>rpc('set_order_status',{p_id:i,p_st:s},'Statut mis à jour');
const depSt=(i,s)=>rpc('review_deposit',{p_id:i,p_st:s},s==1?'Fonds ajoutés':'Refusée');
const adj=id=>{const v=parseInt(prompt('Montant à ajouter (négatif pour retirer) ?'));if(v)rpc('adjust_balance',{p_uid:id,p_amt:v},'Solde mis à jour')};
const upd=async(t,id,o)=>{const{error}=await sb.from(t).update(o).eq('id',id);if(error)toast(error.message);await loadAll();render()};
const togS=id=>upd('services',id,{active:!S.find(s=>s.id==id).active});
const svcForm=(s,c)=>{const i=s?s.id:'n',v=(k,d)=>esc(s?s[k]:d);return`<label>Réseau</label><input id="sf${i}-plat" list="nets" value="${v('plat','')}" placeholder="Ex : TikTok"><label>Nom du service</label><input id="sf${i}-name" value="${v('name','')}" placeholder="Ex : Likes Premium"><label>Emoji</label><input id="sf${i}-em" value="${v('em','⭐')}"><label>Populaire (section « Les plus vendus »)</label><select id="sf${i}-best"><option value="0">Non</option><option value="1" ${s&&s.best?'selected':''}>Oui</option></select><div class="mini"><div style="flex:1"><label>Coût /1000 (FC)</label><input id="sf${i}-cost" type="number" value="${c||0}"></div><div style="flex:1"><label>Prix client /1000 (FC)</label><input id="sf${i}-price" type="number" value="${s?s.price:''}"></div></div><div class="mini"><div style="flex:1"><label>Minimum</label><input id="sf${i}-qmin" type="number" value="${s?s.qmin:10}"></div><div style="flex:1"><label>Maximum</label><input id="sf${i}-qmax" type="number" value="${s?s.qmax:100000}"></div></div>`};
const svcSave=async i=>{const g=k=>$('#sf'+i+'-'+k).value.trim();const o={plat:g('plat'),name:g('name'),em:g('em')||'⭐',best:g('best')=='1',price:+g('price'),qmin:+g('qmin')||1,qmax:+g('qmax')||100000};
 if(!o.plat||!o.name||!(o.price>0))return toast('Réseau, nom et prix requis');
 if(o.qmin>o.qmax)return toast('Le minimum dépasse le maximum');
 let id=i,r;
 if(i=='n'){r=await sb.from('services').insert(o).select('id').single();id=r.data?.id}else r=await sb.from('services').update(o).eq('id',i);
 if(r.error)return toast(r.error.message);
 await sb.from('service_costs').upsert({sid:id,cost:+g('cost')||0});
 await loadAll();toast(i=='n'?'Service ajouté':'Service enregistré');render()};
const applyM=async()=>{const m=parseFloat($('#mg').value);if(isNaN(m))return toast('Entrez un pourcentage');if(!confirm('Recalculer TOUS les prix client avec cette marge ?'))return;const cs=(await sb.from('service_costs').select('*')).data||[];await Promise.all(cs.filter(c=>c.cost>0).map(c=>sb.from('services').update({price:Math.round(c.cost*(1+m/100))}).eq('id',c.sid)));await loadAll();toast('Marge appliquée');render()};
const delS=async id=>{if(!confirm('Supprimer ce service définitivement ?'))return;const{error}=await sb.from('services').delete().eq('id',id);if(error)toast(error.message);await loadAll();render()};
const edP=(id,f,v)=>upd('pay_methods',id,{[f]:v.trim()});
const delP=async id=>{await sb.from('pay_methods').delete().eq('id',id);await loadAll();render()};
const addP=async()=>{const n=prompt('Nom du moyen de paiement ?');if(n){await sb.from('pay_methods').insert({name:n});await loadAll();render()}};
const saveConf=async()=>{await sb.from('settings').update({name:$('#c1').value.trim()||'FastBoost',color:$('#c2').value,wa:$('#c3').value.replace(/\D/g,''),email:$('#c4').value.trim(),wa_channel:$('#c5').value.trim(),usd_rate:+$('#c6').value||2800,ref_pct:+$('#c7').value||0}).eq('id',1);await loadAll();render();toast('Enregistré')};
const none='<div class="empty">Rien pour le moment</div>';
const A={
orders:async()=>{const{data}=await sb.from('orders').select('*,profiles(name,phone,num)').order('id',{ascending:false}).limit(100);
 return(data||[]).map(o=>`<div class="card"><div class="row"><span style="display:flex;gap:10px;align-items:center">${ico(o.sname.split(' · ')[0],36)}<b>${esc(o.sname)}</b></span><span class="st s${o.st}">${ST[o.st]}</span></div><div class="mu">n°${o.id} · ${esc(o.profiles?.name)} · ID ${o.profiles?.num} · ${esc(o.profiles?.phone)}</div><div class="link">${esc(o.link)}</div><div class="row"><span>Qté ${o.qty} · Restant ${rest(o)}</span><b>${fc(o.price)}</b></div><div class="mu">Coût ${fc(o.cost)} · Bénéfice ${fc(o.price-o.cost)}</div>${o.st==4?'':`<div class="mini">${(O[o.id]=`ID ${o.profiles?.num} | ${o.link} | Qté ${o.qty}`,'')}<button class="btn s g" onclick="cp(O[${o.id}])">Copier ID + lien + qté</button><button class="btn s" style="background:#f59e0b" onclick="setRest(${o.id},${rest(o)})">Restant</button><button class="btn s" onclick="setSt(${o.id},2)">▶ Accepter</button><button class="btn s" onclick="setSt(${o.id},3)">✔ Terminé</button><button class="btn s r" onclick="setSt(${o.id},4)">✖ Refuser</button></div>`}</div>`).join('')||none},
deps:async()=>{const{data}=await sb.from('deposits').select('*,profiles(name,phone)').order('id',{ascending:false}).limit(100);
 return(data||[]).map(d=>`<div class="card"><div class="row"><b>${fc(d.amount)}</b><span class="st s${DC[d.st]}">${DS[d.st]}</span></div><div class="mu">${esc(d.profiles?.name)} · ${esc(d.profiles?.phone)}<br>${esc(d.method)} · réf ${esc(d.ref||'-')}</div>${d.st?'':`<div class="mini"><button class="btn s" onclick="depSt(${d.id},1)">Valider + ajouter</button><button class="btn s r" onclick="depSt(${d.id},2)">Refuser</button></div>`}</div>`).join('')||none},
users:async()=>{const{data}=await sb.from('profiles').select('*').order('at',{ascending:false});
 return(data||[]).map(u=>`<div class="card row"><div><b>${esc(u.name)}</b> ${u.role=='admin'?'🛡️':''}<div class="mu">ID ${u.num} · ${esc(u.phone)}</div></div><div style="text-align:right"><b>${fc(u.bal)}</b><br><button class="btn s g" onclick="adj('${u.id}')">± Solde</button></div></div>`).join('')||none},
svcs:async()=>{const cs=Object.fromEntries(((await sb.from('service_costs').select('*')).data||[]).map(x=>[x.sid,x.cost]));
 return`<datalist id="nets">${Object.keys(BR).map(n=>`<option value="${n}">`).join('')}</datalist>
<div class="card"><label style="margin-top:0">Marge appliquée à tous les services (%)</label><div class="mini"><input id="mg" type="number" value="20" style="flex:1;margin:0"><button class="btn s" onclick="applyM()">Appliquer</button></div><div class="mu">Recalcule le prix client = coût × (1 + marge). Les services sans coût ne changent pas.</div></div>
<details class="card"><summary style="font-weight:700;cursor:pointer">➕ Ajouter un service</summary>${svcForm(null,0)}<button class="btn" onclick="svcSave('n')">Ajouter</button></details>
<h2>${S.length} service(s)</h2>`+S.map(s=>`<details class="card"><summary style="display:flex;gap:10px;align-items:center;cursor:pointer;list-style:none">${ico(s.plat,38)}<span style="flex:1"><b>${esc(s.plat)} · ${esc(s.name)}</b><div class="mu">${fc(s.price)} /1000 · ${s.active?'Actif':'Masqué'}</div></span>✏️</summary>${svcForm(s,cs[s.id])}<button class="btn" onclick="svcSave(${s.id})">Enregistrer</button><div class="mini"><button class="btn s g" onclick="togS(${s.id})">${s.active?'Masquer':'Afficher'}</button><button class="btn s r" onclick="delS(${s.id})">Supprimer</button></div></details>`).join('')},
refills:async()=>{const{data}=await sb.from('refills').select('*,orders(sname,link),profiles(name,phone)').order('id',{ascending:false}).limit(100);return(data||[]).map(r=>`<div class="card"><div class="row"><b>${esc(r.orders?.sname)}</b><span class="st ${r.st?'s3':''}">${r.st?'Traitée':'À traiter'}</span></div><div class="mu">Commande n°${r.oid} · ${esc(r.profiles?.name)} · ${esc(r.profiles?.phone)}</div><div class="link">${esc(r.orders?.link)}</div>${r.st?'':`<button class="btn s" onclick="doneRefill(${r.id})">✔ Marquer traitée</button>`}</div>`).join('')||none},
promos:async()=>{const{data}=await sb.from('promos').select('*').order('code');return`<div class="card"><b>Nouveau code promo</b><label>Code (lettres/chiffres)</label><input id="pc" placeholder="BIENVENUE"><div class="mini"><div style="flex:1"><label>Montant offert (FC)</label><input id="pa" type="number"></div><div style="flex:1"><label>Utilisations max</label><input id="pm" type="number" value="100"></div></div><button class="btn" onclick="addPromo()">Créer</button></div>`+(data||[]).map(p=>`<div class="card row"><div><b>${esc(p.code)}</b><div class="mu">${fc(p.amount)} · ${p.used}/${p.max_uses} utilisés · ${p.active?'Actif':'Désactivé'}</div></div><div class="mini" style="margin:0"><button class="btn s g" onclick="togPromo('${esc(p.code)}',${!p.active})">${p.active?'Stop':'Activer'}</button><button class="btn s r" onclick="delPromo('${esc(p.code)}')">✖</button></div></div>`).join('')},
conf:async()=>`<div class="card"><label>Nom du site</label><input id="c1" value="${esc(cfg.name)}"><label>Couleur</label><input id="c2" type="color" value="${cfg.color&&cfg.color!='#10b981'?cfg.color:'#d4af37'}" style="height:48px"><label>WhatsApp public (indicatif, sans +)</label><input id="c3" value="${esc(cfg.wa)}"><label>Lien chaîne WhatsApp (https://...)</label><input id="c5" value="${esc(cfg.wa_channel)}"><label>Email de contact</label><input id="c4" value="${esc(cfg.email)}"><label>Taux : 1 USD = ? FC</label><input id="c6" type="number" value="${cfg.usd_rate||2800}"><label>Bonus parrainage (% de la 1re recharge)</label><input id="c7" type="number" value="${cfg.ref_pct??5}"><button class="btn" onclick="saveConf()">Enregistrer</button></div><div class="card"><b>Sauvegarde (CSV)</b><div class="mini"><button class="btn s" onclick="exp('orders')">Commandes</button><button class="btn s" onclick="exp('profiles')">Clients</button><button class="btn s" onclick="exp('deposits')">Recharges</button></div></div><h2>Moyens de paiement</h2>`
 +P.map(p=>`<div class="card"><label>Nom</label><input value="${esc(p.name)}" onchange="edP(${p.id},'name',this.value)"><label>Numéro</label><input value="${esc(p.num)}" onchange="edP(${p.id},'num',this.value)"><button class="btn s r" style="margin-top:8px" onclick="delP(${p.id})">Supprimer</button></div>`).join('')+'<button class="btn" onclick="addP()">＋ Moyen de paiement</button>'};
const adminV=async()=>await stats()+'<div class="tabs">'+[['orders','📦 Commandes'],['deps','💰 Recharges'],['users','👥 Clients'],['svcs','💲 Tarifs'],['refills','🔄 Garanties'],['promos','🎁 Promos'],['conf','⚙️ Réglages']].map(t=>`<button class="${atab==t[0]?'on':''}" onclick="atab='${t[0]}';render()">${t[1]}</button>`).join('')+'</div>'+await A[atab]();

const LEG={terms:["Conditions d'utilisation",["Nous proposons des services de promotion de comptes sur les réseaux sociaux. Les résultats dépendent des plateformes et ne sont pas garantis à 100 %.","Vous restez responsable du respect des règles de chaque réseau. Nous ne demandons jamais votre mot de passe.","Le solde rechargé sert uniquement à passer des commandes. Une commande non livrée est remboursée sur votre solde.","La garantie de recharge dure 30 jours après la commande, selon le service.","Tout abus, fraude ou usage illégal entraîne la suspension du compte."]],priv:["Politique de confidentialité",["Nous collectons votre nom, votre numéro de téléphone, vos commandes et vos recharges pour faire fonctionner le service.","Nous ne vendons pas vos données. Elles sont stockées chez notre hébergeur (Supabase).","Nous vous contactons seulement au sujet de vos commandes ou de votre compte.","Pour supprimer votre compte, contactez-nous sur WhatsApp."]]};
const legal=k=>modal(`<h2>${LEG[k][0]}</h2>${LEG[k][1].map(x=>`<p class="mu" style="margin:10px 0">• ${x}</p>`).join('')}<button class="btn g" onclick="modal()">Fermer</button>`);
const legalLinks=()=>`<div class="mini" style="justify-content:center;margin-top:14px"><a class="mu" href="#" onclick="legal('terms');return false">Conditions</a><span class="mu">·</span><a class="mu" href="#" onclick="legal('priv');return false">Confidentialité</a>${/^https:\/\//.test(cfg.wa_channel||'')?`<span class="mu">·</span><a class="mu" href="${esc(cfg.wa_channel)}" target="_blank" rel="noopener">Chaîne WhatsApp</a>`:''}</div>`;
const bestSec=()=>{const b=S.filter(s=>s.active&&s.best);return b.length&&!q&&plat=='all'?`<h2>🔥 Les plus vendus</h2><div class="hs">${b.map(s=>`<div class="card" style="flex:0 0 190px;margin:0"><div style="display:flex;gap:8px;align-items:center">${ico(s.plat,34)}<b>${esc(s.plat)}</b></div><div style="margin:6px 0 2px">${esc(s.name)}</div><b>${fc(s.price)}</b><span class="mu"> /1000</span><button class="btn s" style="margin-top:8px;width:100%" onclick="order(${s.id})">Acheter</button></div>`).join('')}</div>`:''};
const FAQ=[["Mon compte risque-t-il quelque chose ?","Nous ne demandons jamais votre mot de passe, seulement un lien. Aucun service ne peut promettre zéro risque : respectez les règles de chaque réseau."],["Combien de temps pour la livraison ?","Le démarrage est en général rapide, mais les grosses commandes prennent plus de temps. Chaque commande est suivie dans votre compte."],["Comment payer ?","Par Mobile Money (Orange, Airtel, M-Pesa, Afrimoney) : rechargez votre solde, puis commandez."],["Et si le nombre baisse ?","Garantie de recharge de 30 jours : demandez-la depuis votre commande terminée."],["L'inscription est-elle gratuite ?","Oui. Vous ne payez que vos commandes."]];
const landV=()=>`<main><div class="hero" style="text-align:center;margin-top:18px"><h2 style="font-size:34px;letter-spacing:-1px">⚡ ${brand()}</h2><p>Boostez vos réseaux sociaux : abonnés, likes, vues et plus. Paiement Mobile Money.</p><button class="btn" onclick="auth='signup';view='auth';render()">Créer mon compte gratuit</button><button class="btn g" onclick="auth='login';view='auth';render()">Se connecter</button></div>
${bestSec()}<h2>Pourquoi nous choisir</h2><div class="gr">${[['⚡','Suivi en direct','Chaque commande est suivie dans votre compte.'],['💰','Prix bas','Tarifs en FC ou en USD.'],['🔒','Sans mot de passe','Seul le lien est demandé.'],['📱','Mobile Money','Orange, Airtel, M-Pesa, Afrimoney.'],['💬','Support WhatsApp','Une vraie personne vous répond.'],['🔄','Garantie 30 jours','Recharge si le nombre baisse.']].map(x=>`<div class="card"><div style="font-size:24px">${x[0]}</div><b>${x[1]}</b><div class="mu">${x[2]}</div></div>`).join('')}</div>
<h2>Comment ça marche</h2>${['Créez votre compte gratuit','Rechargez par Mobile Money','Choisissez un service et collez votre lien','Suivez votre commande en direct'].map((x,i)=>`<div class="card row" style="justify-content:flex-start;gap:14px"><b style="font-size:22px;color:var(--c)">${i+1}</b>${x}</div>`).join('')}
<h2>Questions fréquentes</h2>${FAQ.map(f=>`<details class="card"><summary style="font-weight:600;cursor:pointer">${f[0]}</summary><div class="mu">${f[1]}</div></details>`).join('')}
<div class="card"><b>Contact</b>${cfg.wa?`<a class="btn g" href="https://wa.me/${esc(cfg.wa)}" target="_blank" rel="noopener">💬 WhatsApp</a>`:''}${cfg.email?`<div class="mu" style="margin-top:10px">✉️ ${esc(cfg.email)}</div>`:''}</div>${legalLinks()}<div style="height:20px"></div></main>`;
async function render(){
 let h;
 if(!me)h=view=='landing'?landV():authV();
 else if(me.role=='admin')h=`<header>🛡️ Admin<button class="btn s g" onclick="logout()">Quitter</button></header><main>${await adminV()}</main>`;
 else{const v={home:homeV,orders:ordersV,fund:fundV,acc:accV}[tab]||homeV;h=hdr()+'<main>'+await v()+'</main>'+nav()}
 $('#app').innerHTML=h;
}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
boot();
</script></body></html>
